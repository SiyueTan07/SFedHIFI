name: sfedhifi

channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.9
  - pytorch=2.2
  - torchvision=0.17
  - torchaudio=2.2
  - pytorch-cuda=11.8
  - numpy
  - scipy
  - matplotlib
  - tqdm
  - tensorboard
  - pip

  - pip:
      - spikingjelly
      - tensorly
      - swanlab
      - prettytable